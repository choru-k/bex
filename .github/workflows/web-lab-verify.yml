name: Web Lab verification

on:
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/bex-web.mjs'
      - '.github/workflows/web-lab-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-lab-supported-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Playwright 1.59+ no longer supports WebKit on macOS 14.
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Record environment
        run: |
          mkdir -p verification
          { node --version; npm --version; uname -a; } | tee verification/environment.log
      - name: Install locked dependencies
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee verification/install.log
      - name: Typecheck, core tests and production build
        run: |
          set -o pipefail
          npm run check 2>&1 | tee verification/check.log
      - name: Compile actual macOS WebKit shell
        if: runner.os == 'macOS' && !cancelled()
        run: |
          set -o pipefail
          xcrun swiftc -parse-as-library -swift-version 5 native/main.swift -o verification/BexWebLab -framework AppKit -framework WebKit 2>&1 | tee verification/native-build.log
      - name: Install browser engines (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium webkit
      - name: Install browser engines (macOS)
        if: runner.os == 'macOS'
        run: npx playwright install chromium webkit
      - name: Real HMR and production rendering
        timeout-minutes: 3
        run: |
          set -o pipefail
          node tests/smoke.mjs 2>&1 | tee verification/smoke.log
      - name: Browser integration tests
        timeout-minutes: 6
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee verification/browser-tests.log
      - name: Run actual one-command macOS app bundle
        if: runner.os == 'macOS' && !cancelled()
        timeout-minutes: 3
        env:
          BEX_WEB_LAB_SMOKE: '1'
        run: |
          set -o pipefail
          node ../scripts/bex-web.mjs desktop 2>&1 | tee verification/native-smoke.log
          grep -F 'BEX_WEB_LAB_SMOKE PASS' verification/native-smoke.log
      - name: Ensure smoke restored source files
        if: always()
        run: git diff --exit-code -- src native ../scripts package-lock.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-lab-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            web/verification/*.log
            web/verification/*.json
            web/verification/*.png
            web/package-lock.json
            web/playwright-report/
            web/test-results/
