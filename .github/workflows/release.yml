name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Test native app
        run: |
          xcodebuild \
            -project Bex.xcodeproj \
            -scheme Bex \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData.noindex \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            -only-testing:BexTests \
            test

      - name: Archive Developer ID app
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Bex.xcodeproj \
            -scheme Bex \
            -configuration Release \
            -archivePath build/Bex.xcarchive \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export signed app
        run: |
          rm -rf build/export
          xcodebuild -exportArchive \
            -archivePath build/Bex.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist Config/ExportOptions.plist

      - name: Verify exported signatures
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/export/Bex.app"
          HELPER="$APP/Contents/Helpers/bex-hook"

          test -x "$HELPER"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$HELPER"

          check_identity() {
            ARTIFACT="$1"
            EXPECTED_IDENTIFIER="$2"
            DETAILS="$(codesign --display --verbose=4 "$ARTIFACT" 2>&1)"
            REQUIREMENT="$(codesign --display --requirements - "$ARTIFACT" 2>&1)"
            printf '%s\n' "$DETAILS" | grep -F "Identifier=$EXPECTED_IDENTIFIER"
            printf '%s\n' "$DETAILS" | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
            printf '%s\n' "$REQUIREMENT" | grep -F "identifier \"$EXPECTED_IDENTIFIER\""
            printf '%s\n' "$REQUIREMENT" \
              | grep -E "certificate leaf\\[subject\\.OU\\] = \\\"?$APPLE_TEAM_ID\\\"?"
          }

          check_identity "$APP" "com.bex.desktop"
          check_identity "$HELPER" "bex-hook"

      - name: Submit for notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent build/export/Bex.app build/Bex-notarization.zip
          xcrun notarytool submit build/Bex-notarization.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple and verify app
        run: |
          xcrun stapler staple build/export/Bex.app
          xcrun stapler validate build/export/Bex.app
          codesign --verify --deep --strict --verbose=2 build/export/Bex.app
          spctl --assess --type execute --verbose=2 build/export/Bex.app
          rm -f build/Bex.zip
          ditto -c -k --keepParent build/export/Bex.app build/Bex.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/Bex.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/Bex.zip --generate-notes
          fi

      - name: Update Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          SHA256="$(shasum -a 256 build/Bex.zip | awk '{print $1}')"
          git clone \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/choru-k/homebrew-tap.git" \
            "$RUNNER_TEMP/homebrew-tap"
          cd "$RUNNER_TEMP/homebrew-tap"

          VERSION="$VERSION" SHA256="$SHA256" ruby <<'RUBY'
          path = "Casks/bex.rb"
          content = File.read(path)
          content.sub!(/^\s*version ".*"$/, %(  version "#{ENV.fetch("VERSION")}"))
          content.sub!(/^\s*sha256 ".*"$/, %(  sha256 "#{ENV.fetch("SHA256")}"))
          content.gsub!(/^\s*depends_on formula: "node"\n/, "")
          content.gsub!(
            /^\s*binary "#\{appdir\}\/Bex\.app\/Contents\/Resources\/bex", target: "bex"\n/,
            "",
          )
          abort "Bex cask must require macOS Ventura or newer" unless content.include?(
            "depends_on macos: :ventura",
          )
          abort "Bex cask must install Bex.app" unless content.include?('app "Bex.app"')
          File.write(path, content)
          RUBY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/bex.rb
          if ! git diff --cached --quiet; then
            git commit -m "bex ${VERSION}"
            git push
          fi
